
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HireMeAI — AI Portfolio Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e5e7ef;--brand:#6366f1;--brand2:#8b5cf6;--bot:#f0f1f9;--good:#10b981;--mid:#f59e0b;--bad:#ef4444}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0e17;--card:#131827;--ink:#e8ecf6;--mute:#8b95ad;--line:#232a3d;--bot:#1b2133}}
:root[data-theme=dark]{--bg:#0b0e17;--card:#131827;--ink:#e8ecf6;--mute:#8b95ad;--line:#232a3d;--bot:#1b2133}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
.app{display:grid;grid-template-columns:320px 1fr;gap:18px;width:100%;max-width:1180px;height:100%;padding:18px}
@media(max-width:860px){.app{grid-template-columns:1fr;padding:0;gap:0}.side{display:none}.side.show{display:flex;position:fixed;inset:0;z-index:5;border-radius:0;border:0}}
.side,.main{background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;min-height:0}
@media(max-width:860px){.main{border-radius:0;border:0}}
.side{padding:22px;overflow:auto;gap:16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.prof{text-align:center;padding:16px 8px;border-radius:16px;background:linear-gradient(160deg,rgba(99,102,241,.12),rgba(139,92,246,.08))}
.av{width:72px;height:72px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-size:26px;font-weight:800}
.prof h3{margin:0;font-size:18px}
.prof p{margin:2px 0 0;color:var(--mute);font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;color:var(--good)}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.live.off{color:var(--mid)}
.sec h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.q{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 11px;margin-bottom:6px;font:500 13px Inter;cursor:pointer;transition:.15s}
.q:hover{border-color:var(--brand);transform:translateX(2px)}
textarea,input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font:14px/1.45 Inter;outline:none}
textarea:focus,input:focus{border-color:var(--brand)}
textarea.jd{min-height:90px;resize:vertical;font-size:13px}
.btn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;border-radius:10px;padding:10px 16px;font:700 13px Inter;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.full{width:100%;margin-top:8px}
.fit{margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--line);font-size:13px;display:none}
.fit.on{display:block}
.fit b.s{font-size:26px;font-weight:800;display:block}
.fit ul{margin:6px 0 0;padding-left:18px}
.head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.tab{border:0;background:none;color:var(--mute);padding:7px 14px;border-radius:9px;font:600 13px Inter;cursor:pointer}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ic{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 11px;font:600 13px Inter;cursor:pointer;margin-left:6px}
.ic:disabled{opacity:.45;cursor:not-allowed}
.ic.m{display:none}
@media(max-width:860px){.ic.m{display:inline-block}}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.msgs{flex:1;overflow:auto;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.m{display:flex;gap:10px;max-width:86%;animation:up .3s both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.m.u{align-self:flex-end;flex-direction:row-reverse}
.b{padding:11px 15px;border-radius:16px;background:var(--bot);overflow-wrap:anywhere}
.m.u .b{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-bottom-right-radius:5px}
.m:not(.u) .b{border-bottom-left-radius:5px}
.b p{margin:0 0 8px}
.b p:last-child{margin:0}
.b ul{margin:4px 0 8px;padding-left:20px}
.pic{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.m.u .pic{display:none}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mute);margin:0 2px;animation:d 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes d{50%{transform:translateY(-4px);opacity:.4}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:99px;font:500 13px Inter;cursor:pointer}
.chips button:hover{border-color:var(--brand);color:var(--brand)}
.bar{display:flex;align-items:flex-end;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}
.bar textarea{flex:1;min-width:0;resize:none;border-radius:14px;padding:12px 14px;font-size:15px;max-height:120px}
.bar .ic{margin:0;flex:none;width:44px;height:44px;padding:0;font-size:18px}
.bar .ic.active{border-color:var(--brand);background:rgba(99,102,241,.12)}
.send{width:46px;height:44px;flex:none;border:0;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:18px;cursor:pointer}
.send:disabled{opacity:.5}
.voice-status{padding:0 16px 10px;font-size:12px;color:var(--mute);min-height:20px}
.voice-status.error{color:var(--bad)}
.err{color:var(--bad)}
.form{padding:22px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
@media(max-width:700px){.form{grid-template-columns:1fr}}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.form textarea{min-height:84px;resize:vertical}
.drop{border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;cursor:pointer;background:var(--bg);font-size:14px}
.drop:hover,.drop.on{border-color:var(--brand)}
.drop small{display:block;color:var(--mute)}
.note{font-size:13px;color:var(--mute)}
.ok{color:var(--good)}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div style="display:flex;justify-content:space-between;align-items:center"><div class="logo"><i>✦</i>HireMeAI</div><button class="ic m" id="closeSide" type="button">✕</button></div>
    <div class="prof">
      <div class="av" id="av">?</div><h3 id="cname">Candidate</h3><p id="chead">Set up the profile to begin</p>
      <span class="live off" id="live">No resume yet</span>
    </div>
    <div class="sec"><h4>Quick questions</h4><div id="qs"></div></div>
    <div class="sec">
      <h4>Resume fit check</h4>
      <textarea class="jd" id="jd" placeholder="Paste a job description to score this candidate against it…"></textarea>
      <button class="btn full" id="fitBtn">Score against JD</button>
      <div class="fit" id="fit"></div>
    </div>
  </aside>

  <main class="main">
    <div class="head">
      <div class="tabs"><button class="tab on" data-v="chat">HR Chat</button><button class="tab" data-v="profile">Candidate Profile</button></div>
      <div><button class="ic m" id="openSide" type="button">☰</button><button class="ic" id="clr" type="button">Clear chat</button><button class="ic" id="theme" type="button">◐</button></div>
    </div>

    <section class="view on" id="v-chat">
      <div class="msgs" id="msgs"></div>
      <div class="bar">
        <button class="ic" id="mic" type="button" title="Start voice input" aria-label="Start voice input">🎙️</button>
        <textarea id="in" rows="1" placeholder="Ask a question or use the microphone…" aria-label="Chat message"></textarea>
        <button class="ic" id="speakToggle" type="button" title="Enable spoken answers" aria-label="Toggle spoken answers" aria-pressed="false">🔇</button>
        <button class="send" id="send" type="button" aria-label="Send message">➤</button>
      </div>
      <div class="voice-status" id="voiceStatus" role="status" aria-live="polite"></div>
    </section>

    <section class="view" id="v-profile">
      <div class="form">
        <div class="full"><div class="drop" id="drop"><b id="dropT">Upload resume (PDF, DOCX or TXT)</b><small>Click or drag a file here — max 5 MB</small></div><input type="file" id="file" accept=".pdf,.docx,.txt" hidden><div class="note" id="upmsg" style="margin-top:6px"></div></div>
        <div><label for="f-name">Full name</label><input type="text" id="f-name"></div>
        <div><label for="f-headline">Headline</label><input type="text" id="f-headline" placeholder="e.g. Final-year AI/ML student"></div>
        <div class="full"><label for="f-about">About / summary</label><textarea id="f-about"></textarea></div>
        <div><label for="f-skills">Skills</label><textarea id="f-skills"></textarea></div>
        <div><label for="f-strengths">Strengths</label><textarea id="f-strengths"></textarea></div>
        <div><label for="f-weaknesses">Weaknesses / areas to improve</label><textarea id="f-weaknesses"></textarea></div>
        <div><label for="f-hobbies">Hobbies &amp; interests</label><textarea id="f-hobbies"></textarea></div>
        <div><label for="f-goals">Career goals</label><textarea id="f-goals"></textarea></div>
        <div><label for="f-extra">Other (availability, location, notice period…)</label><textarea id="f-extra"></textarea></div>
        <div class="full"><button class="btn" id="saveBtn" type="button">Save profile</button> <span class="note" id="savemsg"></span></div>
      </div>
    </section>
  </main>
</div>

<script>
const $=id=>document.getElementById(id), side=$('side');
const TEXT=['name','headline'], AREAS=['about','skills','strengths','weaknesses','hobbies','goals','extra'];
const QUESTIONS=["Give me a 30-second intro of the candidate","What are the candidate's key strengths?","What are the candidate's weaknesses?","What projects has the candidate built?","What are the candidate's hobbies and interests?","Why should we hire this candidate?","Which tech stack is the candidate strongest in?","What are the candidate's career goals?"];
let history=[],busy=false,cand={};

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
function md(t){
  let h='',ul=false;
  for(const l of esc(t).split('\n')){
    const m=l.match(/^\s*[-*•]\s+(.*)/);
    if(m){
      if(!ul){h+='<ul>';ul=true}
      h+='<li>'+inl(m[1])+'</li>';
    }else{
      if(ul){h+='</ul>';ul=false}
      if(l.trim())h+='<p>'+inl(l.replace(/^#+\s*/,''))+'</p>';
    }
  }
  return h+(ul?'</ul>':'');
}
const scrollDown=()=>{const m=$('msgs');m.scrollTop=m.scrollHeight};

// Tabs and theme
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  ['chat','profile'].forEach(v=>$('v-'+v).classList.toggle('on',v===t.dataset.v));
});
$('theme').onclick=()=>{
  const d=document.documentElement,c=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  d.dataset.theme=c==='dark'?'light':'dark';
};
$('closeSide').onclick=()=>side.classList.remove('show');
$('openSide').onclick=()=>side.classList.add('show');

QUESTIONS.forEach(q=>{
  const b=document.createElement('button');
  b.className='q';b.textContent=q;
  b.onclick=()=>{side.classList.remove('show');document.querySelector('[data-v=chat]').click();ask(q)};
  $('qs').appendChild(b);
});

// Candidate profile
async function loadCand(){
  try{
    const r=await fetch('/api/candidate');
    if(!r.ok)throw new Error('Could not load candidate');
    cand=await r.json();
  }catch(e){return}
  TEXT.concat(AREAS).forEach(k=>{
    const el=$('f-'+k);
    if(el&&document.activeElement!==el)el.value=cand[k]||'';
  });
  const n=cand.name||'Candidate';
  $('cname').textContent=n;
  $('av').textContent=(cand.name||'?')[0].toUpperCase();
  $('chead').textContent=cand.headline||'AI portfolio assistant';
  $('live').textContent=cand.has_resume?'Resume loaded':'No resume yet';
  $('live').className='live'+(cand.has_resume?'':' off');
  if(cand.has_resume)$('dropT').textContent='✓ '+cand.resume_filename+' ('+Number(cand.resume_chars||0).toLocaleString()+' characters) — click to replace';
}

$('saveBtn').onclick=async()=>{
  const body={};
  TEXT.concat(AREAS).forEach(k=>body[k]=$('f-'+k).value);
  $('saveBtn').disabled=true;
  try{
    const r=await fetch('/api/candidate',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('Could not save profile');
    $('savemsg').innerHTML='<span class="ok">Saved ✓</span>';
    await loadCand();
  }catch(e){
    $('savemsg').innerHTML='<span class="err">Could not save</span>';
  }
  $('saveBtn').disabled=false;
  setTimeout(()=>$('savemsg').textContent='',2500);
};

const drop=$('drop');
drop.onclick=()=>$('file').click();
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',e=>upload(e.dataTransfer.files[0]));
$('file').onchange=e=>{upload(e.target.files[0]);e.target.value=''};

async function upload(f){
  if(!f)return;
  $('upmsg').textContent='Uploading…';
  const fd=new FormData();
  fd.append('file',f);
  try{
    const r=await fetch('/api/candidate/resume',{method:'POST',body:fd});
    const j=await r.json();
    if(!r.ok)throw new Error(j.detail||'Upload failed');
    $('upmsg').innerHTML='<span class="ok">Resume processed ✓</span>';
    await loadCand();
  }catch(e){
    $('upmsg').innerHTML='<span class="err"></span>';
    $('upmsg').firstChild.textContent=e.message;
  }
}

// Chat messages
function bubble(role,html){
  const d=document.createElement('div');
  d.className='m '+(role==='user'?'u':'');
  d.innerHTML='<div class="pic">AI</div><div class="b"></div>';
  d.querySelector('.b').innerHTML=html;
  $('msgs').appendChild(d);
  scrollDown();
  return d.querySelector('.b');
}

function welcome(){
  const n=cand.name||'the candidate';
  const b=bubble('bot',`<p>Hi! I can answer questions about <b>${esc(n)}</b> based on the resume and profile on file — and I'll say so honestly if something isn't there.</p><div class="chips"></div>`);
  ['What are the strengths?','What are the weaknesses?','Tell me about the hobbies','Walk me through the projects'].forEach(q=>{
    const c=document.createElement('button');
    c.textContent=q;
    c.onclick=()=>ask(q);
    b.querySelector('.chips').appendChild(c);
  });
  if(cand.llm_ready===false)bubble('bot','<span class="err">Server has no GROQ_API_KEY yet — add it to .env and restart.</span>');
}

$('clr').onclick=()=>{
  stopSpeaking();
  history=[];
  $('msgs').innerHTML='';
  welcome();
};

// Voice input and output
const mic=$('mic');
const speakToggle=$('speakToggle');
const voiceStatus=$('voiceStatus');
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null,listening=false,speakAnswers=false;

function setVoiceStatus(message,isError=false){
  voiceStatus.textContent=message;
  voiceStatus.classList.toggle('error',isError);
}

function stopSpeaking(){
  if('speechSynthesis' in window)speechSynthesis.cancel();
}

if(SpeechRecognition){
  recognition=new SpeechRecognition();
  recognition.lang='en-IN';
  recognition.continuous=false;
  recognition.interimResults=true;
  recognition.maxAlternatives=1;

  recognition.onstart=()=>{
    listening=true;
    mic.textContent='⏹️';
    mic.classList.add('active');
    mic.title='Stop listening';
    setVoiceStatus('Listening… Speak your question.');
  };

  recognition.onresult=event=>{
    let interim='',finalText='';
    for(let i=event.resultIndex;i<event.results.length;i++){
      const transcript=event.results[i][0].transcript;
      if(event.results[i].isFinal)finalText+=transcript;
      else interim+=transcript;
    }
    const current=$('in').value;
    const spoken=(finalText||interim).trim();
    $('in').value=spoken;
    $('in').style.height='auto';
    $('in').style.height=Math.min($('in').scrollHeight,120)+'px';
    setVoiceStatus(finalText?'Speech recognized. Review it and press send.':'Recognizing speech…');
  };

  recognition.onerror=event=>{
    const messages={
      'not-allowed':'Microphone access was denied. Allow microphone access in your browser settings.',
      'no-speech':'No speech detected. Try speaking a little louder.',
      'audio-capture':'No microphone was found. Check your microphone connection.',
      'network':'Speech recognition needs a network connection in this browser.'
    };
    setVoiceStatus(messages[event.error]||('Voice input error: '+event.error),true);
  };

  recognition.onend=()=>{
    listening=false;
    mic.textContent='🎙️';
    mic.classList.remove('active');
    mic.title='Start voice input';
    if(voiceStatus.textContent==='Listening… Speak your question.')setVoiceStatus('Listening stopped.');
  };

  mic.onclick=()=>{
    if(listening){
      recognition.stop();
      return;
    }
    try{
      stopSpeaking();
      recognition.start();
    }catch(e){
      setVoiceStatus('Could not start the microphone. Please try again.',true);
    }
  };
}else{
  mic.disabled=true;
  mic.title='Speech recognition is not supported in this browser';
  setVoiceStatus('Voice input is unavailable in this browser. Try Chrome or Edge.');
}

speakToggle.onclick=()=>{
  if(!('speechSynthesis' in window)){
    setVoiceStatus('Spoken output is not supported in this browser.',true);
    speakToggle.disabled=true;
    return;
  }
  speakAnswers=!speakAnswers;
  speakToggle.textContent=speakAnswers?'🔊':'🔇';
  speakToggle.title=speakAnswers?'Disable spoken answers':'Enable spoken answers';
  speakToggle.setAttribute('aria-pressed',String(speakAnswers));
  if(!speakAnswers)stopSpeaking();
  setVoiceStatus(speakAnswers?'Spoken answers enabled.':'Spoken answers disabled.');
};

function speakAnswer(text){
  if(!speakAnswers||!('speechSynthesis' in window))return;
  const cleanText=text
    .replace(/```[\s\S]*?```/g,' ')
    .replace(/`([^`]+)`/g,'$1')
    .replace(/[*#_]/g,'')
    .replace(/https?:\/\/\S+/g,'')
    .trim();
  if(!cleanText)return;
  stopSpeaking();
  const utterance=new SpeechSynthesisUtterance(cleanText);
  utterance.lang='en-IN';
  utterance.rate=1;
  utterance.pitch=1;
  utterance.onerror=()=>setVoiceStatus('Could not play the spoken answer.',true);
  speechSynthesis.speak(utterance);
}

// Send and stream chat response
async function ask(text){
  text=(text||$('in').value).trim();
  if(!text||busy)return;

  stopSpeaking();
  $('in').value='';
  $('in').style.height='auto';
  document.querySelectorAll('.chips').forEach(c=>c.remove());

  bubble('user',esc(text));
  busy=true;
  $('send').disabled=true;
  mic.disabled=true;

  const out=bubble('bot','<span class="dots"><span></span><span></span><span></span></span>');
  let full='';

  try{
    const r=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,history})
    });

    if(!r.ok){
      const j=await r.json().catch(()=>({}));
      throw new Error(j.detail||'Server error '+r.status);
    }

    const rd=r.body.getReader(),dec=new TextDecoder();

    while(true){
      const{done,value}=await rd.read();
      if(done)break;
      full+=dec.decode(value,{stream:true});
      out.innerHTML=md(full);
      scrollDown();
    }

    full+=dec.decode();
    out.innerHTML=md(full);
    history.push({role:'user',content:text},{role:'assistant',content:full});
    speakAnswer(full);
  }catch(e){
    out.innerHTML='<span class="err"></span>';
    out.firstChild.textContent=e.message;
    setVoiceStatus('Chat request failed: '+e.message,true);
  }

  busy=false;
  $('send').disabled=false;
  mic.disabled=!SpeechRecognition;
  $('in').focus();
}

$('send').onclick=()=>ask();
$('in').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    ask();
  }
});
$('in').addEventListener('input',e=>{
  e.target.style.height='auto';
  e.target.style.height=Math.min(e.target.scrollHeight,120)+'px';
});

// JD fit check
$('fitBtn').onclick=async()=>{
  const jd=$('jd').value.trim(),box=$('fit');
  if(!jd)return;
  $('fitBtn').disabled=true;
  box.className='fit on';
  box.textContent='Analyzing…';

  try{
    const fd=new FormData();
    fd.append('job_description',jd);
    const r=await fetch('/api/score',{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||'Failed');

    const col=d.score>=70?'var(--good)':d.score>=45?'var(--mid)':'var(--bad)';
    box.innerHTML='<b class="s" style="color:'+col+'"></b><span></span><ul></ul>';
    box.querySelector('.s').textContent=d.score+'/100';
    box.querySelector('span').textContent=d.summary;
    const ul=box.querySelector('ul');

    (d.strengths||[]).forEach(s=>{
      const li=document.createElement('li');
      li.textContent='✓ '+s;
      ul.appendChild(li);
    });
    (d.gaps||[]).forEach(s=>{
      const li=document.createElement('li');
      li.textContent='✗ '+s;
      ul.appendChild(li);
    });
  }catch(e){
    box.innerHTML='<span class="err"></span>';
    box.firstChild.textContent=e.message;
  }

  $('fitBtn').disabled=false;
};

loadCand().then(welcome);
</script>
</body>
</html>
